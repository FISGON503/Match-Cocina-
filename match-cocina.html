<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2ECC71">
<title>Match &amp; Cocina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
*,::before,::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#EEF3F0}
h1,h2,h3,h4,p,ul,ol{margin:0}
h1,h2,h3,h4{font-size:inherit;font-weight:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0}
svg{display:block;vertical-align:middle}
.absolute{position:absolute}
.flex{display:flex}
.flex-1{flex:1 1 0%}
.flex-col{flex-direction:column}
.flex-none{flex:none}
.flex-wrap{flex-wrap:wrap}
.font-bold{font-weight:700}
.font-extrabold{font-weight:800}
.font-semibold{font-weight:600}
.gap-1{gap:0.25rem}
.gap-1\.5{gap:0.375rem}
.gap-2{gap:0.5rem}
.gap-2\.5{gap:0.625rem}
.gap-3{gap:0.75rem}
.gap-4{gap:1rem}
.gap-x-3{column-gap:0.75rem}
.gap-y-0\.5{row-gap:0.125rem}
.grid{display:grid}
.grid-cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.inline-flex{display:inline-flex}
.items-center{align-items:center}
.items-start{align-items:flex-start}
.justify-between{justify-content:space-between}
.justify-center{justify-content:center}
.left-5{left:1.25rem}
.mb-2{margin-bottom:0.5rem}
.min-h-0{min-height:0}
.min-w-0{min-width:0}
.mt-0\.5{margin-top:0.125rem}
.mt-1{margin-top:0.25rem}
.mt-2{margin-top:0.5rem}
.mt-3{margin-top:0.75rem}
.mt-5{margin-top:1.25rem}
.mt-6{margin-top:1.5rem}
.my-5{margin-top:1.25rem;margin-bottom:1.25rem}
.overflow-x-auto{overflow-x:auto}
.overflow-y-auto{overflow-y:auto}
.pb-2{padding-bottom:0.5rem}
.pb-3{padding-bottom:0.75rem}
.pb-4{padding-bottom:1rem}
.pb-5{padding-bottom:1.25rem}
.pb-6{padding-bottom:1.5rem}
.pt-2{padding-top:0.5rem}
.pt-3{padding-top:0.75rem}
.pt-4{padding-top:1rem}
.pt-5{padding-top:1.25rem}
.px-5{padding-left:1.25rem;padding-right:1.25rem}
.px-8{padding-left:2rem;padding-right:2rem}
.py-2{padding-top:0.5rem;padding-bottom:0.5rem}
.relative{position:relative}
.right-5{right:1.25rem}
.text-2xl{font-size:1.5rem;line-height:2rem}
.text-3xl{font-size:1.875rem;line-height:2.25rem}
.text-center{text-align:center}
.text-sm{font-size:.875rem;line-height:1.25rem}
.text-xl{font-size:1.25rem;line-height:1.75rem}
.w-full{width:100%}


.mc-root{
  --brand:#2ECC71; --brand-deep:#178A45; --brand-ink:#0C3A1F; --brand-soft:#E9F9F0; --brand-line:#BDEBD1;
  --ink:#2C3E50; --ink-2:#5D6F80; --bg:#FAFAFA; --line:#E5EAED;
  font-family:'Figtree',ui-rounded,system-ui,-apple-system,'Segoe UI',sans-serif; color:var(--ink);
}
.mc-root *{box-sizing:border-box}
.mc-root button{font-family:inherit; cursor:pointer; border:0; background:none; color:inherit}
.mc-root button:focus-visible{outline:3px solid var(--brand-deep); outline-offset:2px}
.mc-display{font-family:'Bricolage Grotesque','Figtree',ui-rounded,system-ui,sans-serif; letter-spacing:-0.02em}
.mc-soft{color:var(--ink-2)}
.mc-deep{color:var(--brand-deep)}

.mc-stage{min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; background:#E3EBE6}
.mc-wrap{display:flex; flex-direction:column; gap:12px; width:100%; transition:width .35s ease}
.mc-wrap.phone{width:390px; max-width:100%}
.mc-wrap.tablet{width:1100px; max-width:100%}
.mc-toolbar{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap}
.mc-logo{width:28px; height:28px; border-radius:10px; background:var(--brand); color:var(--brand-ink); display:inline-flex; align-items:center; justify-content:center}
.mc-seg{display:inline-flex; padding:3px; background:#fff; border:1px solid var(--line); border-radius:999px}
.mc-seg button{display:inline-flex; align-items:center; gap:6px; padding:6px 13px; border-radius:999px; font-size:13px; font-weight:700; color:var(--ink-2)}
.mc-seg button[aria-pressed="true"]{background:var(--ink); color:#fff}

.mc-device{position:relative; display:flex; flex-direction:column; width:100%; background:var(--bg); overflow:hidden; border:9px solid #17231f; box-shadow:0 34px 60px -30px rgba(20,50,35,.55)}
.mc-wrap.phone .mc-device{height:min(820px, calc(100vh - 96px)); min-height:620px; border-radius:46px}
.mc-wrap.tablet .mc-device{height:min(740px, calc(100vh - 96px)); min-height:560px; border-radius:30px}
.mc-status{position:relative; flex:none; height:32px; display:flex; align-items:center; padding:0 28px; font-size:12.5px; font-weight:700}
.mc-island{position:absolute; left:50%; top:8px; width:88px; height:22px; margin-left:-44px; border-radius:999px; background:#17231f}
.mc-wrap.tablet .mc-island{display:none}
.mc-body{position:relative; flex:1; min-height:0; display:flex; flex-direction:column}

@media (max-width:520px){
  .mc-stage{padding:0; justify-content:flex-start}
  .mc-toolbar,.mc-status{display:none}
  .mc-wrap,.mc-wrap.phone,.mc-wrap.tablet{width:100%; gap:0}
  .mc-wrap .mc-device{height:100vh; height:100dvh; min-height:0; border:0; border-radius:0}
}

.mc-noscroll{scrollbar-width:none}
.mc-noscroll::-webkit-scrollbar{display:none}

.mc-chip{display:inline-flex; align-items:center; gap:7px; padding:8px 14px; border-radius:999px; border:1.5px solid var(--line); background:#fff; font-size:13.5px; font-weight:700; color:var(--ink-2); white-space:nowrap; flex:none; transition:background .15s,color .15s,border-color .15s}
.mc-chip[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:#fff}
.mc-chipcount{min-width:18px; height:18px; padding:0 5px; border-radius:999px; background:var(--brand); color:var(--brand-ink); font-size:11px; font-weight:800; display:inline-flex; align-items:center; justify-content:center}

.mc-tile{position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; padding:14px 4px 11px; border-radius:20px; background:#fff; border:2px solid var(--line); transition:border-color .15s, background .15s, transform .12s}
.mc-tile:hover{border-color:var(--brand-line)}
.mc-tile:active{transform:scale(.96)}
.mc-tile[aria-pressed="true"]{border-color:var(--brand); background:var(--brand-soft)}
.mc-emoji{font-size:38px; line-height:1}
.mc-tname{font-size:13px; font-weight:700; text-align:center; line-height:1.15}
.mc-check{position:absolute; top:7px; right:7px; width:21px; height:21px; border-radius:999px; background:var(--brand); color:var(--brand-ink); display:flex; align-items:center; justify-content:center; animation:mc-pop .18s ease-out}

.mc-btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:46px; padding:0 20px; border-radius:999px; background:var(--brand); color:var(--brand-ink); font-weight:800; font-size:15px; transition:background .15s, transform .1s}
.mc-btn:hover{background:#28BD68}
.mc-btn:active{transform:scale(.98)}
.mc-btn:disabled{background:#DDE4E0; color:#88968F; cursor:not-allowed}
.mc-btn.dark{background:var(--ink); color:#fff}
.mc-btn.dark:hover{background:#243443}
.mc-btn.ghost{background:#fff; color:var(--ink); border:1.5px solid var(--line)}
.mc-btn.ghost:hover{background:#F3F6F4}
.mc-fab{min-height:56px; font-size:17px; box-shadow:0 14px 26px -10px rgba(46,204,113,.85)}
.mc-fab:disabled{box-shadow:none}
.mc-hint{position:absolute; left:50%; bottom:82px; transform:translateX(-50%); padding:6px 12px; border-radius:999px; background:var(--ink); color:#fff; font-size:12.5px; font-weight:600; white-space:nowrap; animation:mc-fadein .2s}
.mc-fade{position:absolute; left:0; right:0; bottom:0; height:104px; pointer-events:none; background:linear-gradient(to top, var(--bg) 55%, rgba(250,250,250,0))}
.mc-bump{display:inline-block; animation:mc-pop .22s ease-out}

.mc-iconbtn{flex:none; width:46px; height:46px; border-radius:999px; border:1.5px solid var(--line); background:#fff; display:inline-flex; align-items:center; justify-content:center; color:var(--ink-2); transition:background .15s,color .15s}
.mc-iconbtn[aria-pressed="true"]{color:var(--brand-deep); border-color:var(--brand-line); background:var(--brand-soft)}

.mc-card{background:#fff; border:1px solid var(--line); border-radius:24px; padding:14px}
.mc-recipe-emoji{flex:none; width:56px; height:56px; border-radius:18px; background:var(--brand-soft); display:flex; align-items:center; justify-content:center; font-size:30px}
.mc-rtitle{font-size:18px; font-weight:800; line-height:1.15}
.mc-mini{display:inline-flex; align-items:center; gap:4px; padding:4px 9px; border-radius:999px; background:#F1F5F3; font-size:12px; font-weight:600; color:var(--ink-2)}

.mc-nav{flex:none; display:flex; padding:6px 10px 10px; background:#fff; border-top:1px solid var(--line)}
.mc-nav button{position:relative; flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:4px 0; font-size:12px; font-weight:700; color:var(--ink-2)}
.mc-navicon{display:inline-flex; padding:5px 20px; border-radius:999px; transition:background .2s}
.mc-nav button[aria-current="page"]{color:var(--brand-deep)}
.mc-nav button[aria-current="page"] .mc-navicon{background:var(--brand-soft)}
.mc-badge{position:absolute; top:0; left:calc(50% + 10px); min-width:17px; height:17px; padding:0 4px; border-radius:999px; background:var(--brand); color:var(--brand-ink); font-size:10.5px; font-weight:800; display:flex; align-items:center; justify-content:center}
.mc-dot{position:absolute; top:3px; left:calc(50% + 14px); width:9px; height:9px; border-radius:999px; background:var(--brand); border:2px solid #fff}

.mc-note{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 12px; border-radius:16px; background:#FFF6DD; color:#6B5210; font-size:13.5px; font-weight:600}

/* Carga */
.mc-loading{position:absolute; inset:0; z-index:30; background:var(--bg); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; animation:mc-fadein .2s}
.mc-stagefx{position:relative; width:280px; height:240px}
.mc-pan{position:absolute; left:50%; top:50%; width:118px; height:118px; margin:-59px 0 0 -59px; border-radius:999px; background:var(--ink); box-shadow:inset 0 0 0 9px #3A4F63; display:flex; align-items:center; justify-content:center; font-size:46px; animation:mc-bob 1.6s ease-in-out infinite}
.mc-fly{position:absolute; left:50%; top:50%; width:40px; height:40px; margin:-20px 0 0 -20px; font-size:32px; line-height:40px; text-align:center; animation:mc-fly 1.6s ease-in infinite}
.mc-progress{width:190px; height:6px; border-radius:999px; background:var(--line); overflow:hidden}
.mc-progress span{display:block; height:100%; background:var(--brand); animation:mc-progress 1.9s linear forwards}

/* Hoja de receta */
.mc-sheet-wrap{position:absolute; inset:0; z-index:40; display:flex; align-items:flex-end; justify-content:center; background:rgba(18,32,27,.5); animation:mc-fadein .2s}
.mc-sheet-wrap.wide{align-items:center}
.mc-sheet{width:100%; max-height:93%; display:flex; flex-direction:column; background:var(--bg); border-radius:28px 28px 0 0; overflow:hidden; animation:mc-slideup .28s ease-out}
.mc-sheet-wrap.wide .mc-sheet{width:560px; max-height:90%; border-radius:28px; animation:mc-pop .22s ease-out}
.mc-step{display:flex; gap:12px; align-items:flex-start; padding:13px 14px; border-radius:18px; border:1.5px solid var(--line); background:#fff; font-size:15.5px; line-height:1.4; transition:background .2s,border-color .2s}
.mc-step.is-on{border-color:var(--brand); background:var(--brand-soft)}
.mc-stepnum{flex:none; width:26px; height:26px; border-radius:999px; background:var(--ink); color:#fff; font-size:13px; font-weight:800; display:flex; align-items:center; justify-content:center}
.mc-step.is-on .mc-stepnum{background:var(--brand); color:var(--brand-ink)}
.mc-voice{border-radius:22px; background:var(--brand-soft); border:1.5px solid var(--brand-line); padding:12px 14px}
.mc-mic{flex:none; width:44px; height:44px; border-radius:999px; background:var(--brand); color:var(--brand-ink); display:flex; align-items:center; justify-content:center; animation:mc-pulse 1.6s ease-out infinite}
.mc-wave{display:flex; align-items:center; gap:3px; height:26px}
.mc-wave i{display:block; width:4px; border-radius:4px; background:var(--brand-deep); height:8px; animation:mc-wave 1s ease-in-out infinite}
.mc-wave i:nth-child(2){animation-delay:.15s}.mc-wave i:nth-child(3){animation-delay:.3s}.mc-wave i:nth-child(4){animation-delay:.45s}.mc-wave i:nth-child(5){animation-delay:.6s}
.mc-cmd{display:inline-flex; align-items:center; gap:6px; padding:8px 13px; border-radius:999px; background:#fff; border:1.5px solid var(--brand-line); font-size:13.5px; font-weight:700; color:var(--brand-ink)}
.mc-cmd:hover{background:#F4FCF8}

@keyframes mc-pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes mc-fadein{from{opacity:0}to{opacity:1}}
@keyframes mc-slideup{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes mc-fly{0%{transform:translate(var(--x),var(--y)) scale(1);opacity:0}15%{opacity:1}70%{transform:translate(0,0) scale(.5);opacity:1}100%{transform:translate(0,0) scale(.2);opacity:0}}
@keyframes mc-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes mc-progress{from{width:0}to{width:100%}}
@keyframes mc-wave{0%,100%{height:8px}50%{height:24px}}
@keyframes mc-pulse{0%{box-shadow:0 0 0 0 rgba(46,204,113,.55)}100%{box-shadow:0 0 0 16px rgba(46,204,113,0)}}

/* Acabado profesional */
.mc-root{--shadow:0 1px 2px rgba(25,45,38,.06),0 10px 26px -14px rgba(25,45,38,.22)}
.mc-card{border:0; box-shadow:var(--shadow)}
.mc-tile{border-width:1.5px; box-shadow:0 1px 2px rgba(25,45,38,.05)}
.mc-tile[aria-pressed="true"]{box-shadow:0 0 0 4px rgba(46,204,113,.16)}
.mc-btn{background:linear-gradient(180deg,#3AD87C,#2ECC71); box-shadow:inset 0 -2px 0 rgba(0,0,0,.08)}
.mc-nav{border-top:0; box-shadow:0 -10px 26px -18px rgba(25,45,38,.35)}
.mc-recipe-emoji{background:linear-gradient(135deg,#EAFAF1,#CFF1DE)}
.mc-chip{box-shadow:0 1px 2px rgba(25,45,38,.04)}
.mc-hero{border-radius:24px; padding:18px 20px; color:#fff; background:radial-gradient(120% 140% at 100% 0%,#2f8f5b 0%,rgba(47,143,91,0) 55%),linear-gradient(135deg,#1E3A33,#2C3E50)}
.mc-avatar{width:48px; height:48px; border-radius:999px; background:var(--brand-soft); color:var(--brand-deep); display:flex; align-items:center; justify-content:center; border:2px solid var(--brand-line)}
.mc-switch{position:relative; flex:none; width:48px; height:28px; border-radius:999px; background:#CBD5D0; transition:background .2s}
.mc-switch::after{content:""; position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:999px; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.25); transition:transform .2s}
.mc-switch[aria-checked="true"]{background:var(--brand)}
.mc-switch[aria-checked="true"]::after{transform:translateX(20px)}
.mc-onb{position:absolute; inset:0; z-index:60; display:flex; flex-direction:column; padding:26px 24px 24px; background:radial-gradient(120% 70% at 50% 0%,#D3F4E1 0%,#FAFAFA 62%); animation:mc-fadein .25s}
.mc-onb-art{flex:1; display:flex; align-items:center; justify-content:center}
.mc-onb-circle{width:190px; height:190px; border-radius:999px; background:#fff; box-shadow:var(--shadow); display:flex; align-items:center; justify-content:center; font-size:88px; animation:mc-pop .3s ease-out}
.mc-dots i{display:block; height:8px; width:8px; border-radius:999px; background:#D5DDD9; transition:width .2s,background .2s}
.mc-dots i.on{width:26px; background:var(--brand)}

/* Rediseño: más pantallas y más acabado */
.mc-pantry-head{padding-top:16px; background:linear-gradient(180deg,#DFF6E9 0%,rgba(250,250,250,0) 100%)}
.mc-emoji{width:56px; height:56px; border-radius:18px; background:#F2F7F4; display:flex; align-items:center; justify-content:center; font-size:32px}
.mc-tile[aria-pressed="true"] .mc-emoji{background:#fff}
.mc-tile{padding:12px 4px 11px}
.mc-sub{position:absolute; inset:0; z-index:35; display:flex; flex-direction:column; background:var(--bg); animation:mc-slideup .25s ease-out}
.mc-subhead{display:flex; align-items:center; gap:12px; padding:16px 16px 12px}
.mc-row{display:flex; align-items:center; gap:12px; width:100%; padding:14px 16px; text-align:left}
.mc-rowicon{width:36px; height:36px; border-radius:12px; background:var(--brand-soft); color:var(--brand-deep); display:flex; align-items:center; justify-content:center}
.mc-roundcheck{flex:none; width:26px; height:26px; border-radius:999px; border:2px solid #C5D0CA; display:flex; align-items:center; justify-content:center}
.mc-roundcheck[aria-pressed="true"]{background:var(--brand); border-color:var(--brand); color:var(--brand-ink)}
.mc-navicon{padding:5px 22px}
.mc-nav button[aria-current="page"] .mc-navicon{background:linear-gradient(180deg,#E9F9F0,#D6F4E3)}

/* Modo app: pantalla completa y zonas seguras */
.mc-stage{display:block; padding:0; min-height:100vh; min-height:100dvh; background:var(--bg)}
.mc-wrap{width:100%; max-width:none; gap:0}
.mc-device{height:100vh; height:100dvh; min-height:0; border:0; border-radius:0; box-shadow:none; padding-top:env(safe-area-inset-top,0px)}
.mc-nav{padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.mc-root{-webkit-tap-highlight-color:transparent; touch-action:manipulation}

@media (prefers-reduced-motion:reduce){
  .mc-root *{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important}
}

/* Navegador de escritorio: contenido centrado */
.mc-stage{background:#EEF3F0}
.mc-wrap{max-width:1100px; margin:0 auto; background:var(--bg)}
@media (min-width:1101px){.mc-wrap{box-shadow:0 0 0 1px var(--line),0 30px 60px -30px rgba(20,50,35,.35)}}
#boot{display:flex;align-items:center;justify-content:center;min-height:100vh;font:600 15px system-ui,sans-serif;color:#5D6F80}
</style>
</head>
<body>
<div id="root"><div id="boot">Cargando Match &amp; Cocina…</div></div>
<noscript>Esta aplicación necesita JavaScript.</noscript>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<script type="text/babel" data-presets="react">

        used: [...base, ...(leche ? ["leche"] : []), ...(queso ? ["queso"] : []), ...(mant ? ["mantequilla"] : [])],
        steps: [
          `Trocea ${join(base)} y sofríe 5 min en una olla con ${mant ? "mantequilla" : "aceite"}.`,
          `Cubre con agua y cuece 15 min${leche ? "; añade la leche al final" : ""}.`,
          `Tritura hasta que quede fina y sazona con sal y pimienta${queso ? "; remata con queso rallado" : ""}.`,
        ],
      };
    },
  },
  {
    key: "tostas",
    can: (g) => g.has("pan"),
    make: (g) => {
      const tops = [
        ...g.V.filter((id) => id !== "ajo").slice(0, 2),
        ...["queso", "atun", "huevos", "bacon", "mantequilla"].filter(g.has),
      ];
      const hot = tops.filter((id) => ["bacon", "huevos"].includes(id));
      const cold = tops.filter((id) => !hot.includes(id));
      let s2 = "Reparte un chorrito de aceite y una pizca de sal.";
      if (hot.length) s2 = `Dora ${join(hot)} en la plancha 4 min${cold.length ? ` y corta ${join(cold)} en láminas` : ""}.`;
      else if (cold.length) s2 = `Corta ${join(cold)} en láminas o machácalo con aceite y sal.`;
      return {
        emoji: "🥪",
        title: tops.length ? `Tostas de ${join(tops.slice(0, 3))}` : "Pan tostado con aceite",
        time: 10,
        used: ["pan", ...tops],
        steps: ["Tuesta el pan 2-3 min hasta que quede crujiente.", s2, "Monta las tostas y sirve al momento."],
      };
    },
  },
  {
    key: "salteado",
    can: (g) => g.cookV.length + g.P.length > 0,
    make: (g) => {
      const P = g.P.slice(0, 2), V = g.cookV.slice(0, 4);
      const used = [...P, ...V];
      let s2;
      if (P.length && V.length) s2 = `Dora ${join(P)} 5 min en sartén caliente; añade ${join(V)} y saltea 6 min.`;
      else if (P.length) s2 = `Dora ${join(P)} 7 min en sartén caliente con aceite.`;
      else s2 = `Saltea ${join(V)} 8 min a fuego fuerte, removiendo.`;
      return {
        emoji: "🥘",
        title: P.length && V.length ? `${cap(n(P[0]))} ${ADJ[P[0]] || "salteado"} con ${join(V.slice(0, 2))}` : `Salteado de ${join(used.slice(0, 3))}`,
        time: 15,
        used,
        steps: [`Corta ${join(used)} en trozos pequeños.`, s2, "Sazona con sal y pimienta y sirve enseguida."],
      };
    },
  },
];

// Se usan solo si hay menos de 3 recetas específicas
const GENERIC = [
  (g, items) => ({
    key: "horno", emoji: "🍽️", time: 35, used: items,
    title: `Bandeja al horno de ${join(items.slice(0, 3))}`,
    steps: [
      `Precalienta el horno a 200 °C y corta ${join(items)} en trozos.`,
      "Reparte en una bandeja con aceite, sal y pimienta.",
      "Hornea 25 min, dando la vuelta a mitad de cocción.",
    ],
  }),
  (g, items) => ({
    key: "guiso", emoji: "🥣", time: 25, used: items,
    title: `Guiso casero de ${join(items.slice(0, 3))}`,
    steps: [
      `Sofríe ${join(items)} 5 min en una olla con aceite.`,
      "Cubre con agua y cuece tapado 15 min.",
      "Rectifica de sal, deja reposar 2 min y sirve.",
    ],
  }),
  (g, items) => ({
    key: "sarten", emoji: "🍳", time: 15, used: items,
    title: `Sartén de ${join(items.slice(0, 3))}`,
    steps: [
      `Corta ${join(items)} en trozos pequeños.`,
      "Cocina a fuego medio 10 min con un chorrito de aceite.",
      "Sazona con sal y pimienta y sirve caliente.",
    ],
  }),
];

function buildMatches(sel) {
  const g = groups(sel);
  const specific = GENERATORS.filter((x) => x.can(g)).map((x) => ({ key: x.key, ...x.make(g) }));
  specific.sort((a, b) => b.used.length - a.used.length);
  const out = specific.slice(0, 3);
  const notLiquid = sel.filter((id) => !["leche", "yogur", "mantequilla"].includes(id));
  const items = (notLiquid.length ? notLiquid : sel).slice(0, 6);
  for (const gen of GENERIC) {
    if (out.length >= 3) break;
    out.push(gen(g, items));
  }
  return out.map((r) => ({
    ...r,
    id: `${r.key}:${r.used.join(",")}`,
    total: sel.length,
    pct: Math.min(100, Math.round((r.used.length / sel.length) * 100)),
  }));
}

function useStored(key, initial) {
  const [v, setV] = useState(() => {
    try {
      const r = localStorage.getItem("mc:" + key);
      return r ? JSON.parse(r) : initial;
    } catch (e) { return initial; }
  });
  useEffect(() => {
    try { localStorage.setItem("mc:" + key, JSON.stringify(v)); } catch (e) { /* sin almacenamiento */ }
  }, [key, v]);
  return [v, setV];
}

function RecipeSheet({ recipe, onClose, fav, onFav, wide }) {
  const [voice, setVoice] = useState({ on: false, step: 0, done: false });

  const say = useCallback((text) => {
    try {
      const s = window.speechSynthesis;
      if (!s) return;
      s.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "es-ES";
      s.speak(u);
    } catch (e) { /* sin voz disponible: el modo sigue funcionando en silencio */ }
  }, []);
  const silence = () => { try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch (e) {} };

  useEffect(() => {
    const onKey = (e) => e.key === "Escape" && onClose();
    window.addEventListener("keydown", onKey);
    return () => { window.removeEventListener("keydown", onKey); silence(); };
  }, [onClose]);

  const start = () => { setVoice({ on: true, step: 0, done: false }); say(`Paso 1. ${recipe.steps[0]}`); };
  const stop = () => { silence(); setVoice({ on: false, step: 0, done: false }); };
  const repeat = () => say(`Paso ${voice.step + 1}. ${recipe.steps[voice.step]}`);
  const next = () => {
    if (voice.step >= recipe.steps.length - 1) {
      setVoice({ on: true, step: voice.step, done: true });
      say("Listo. ¡Buen provecho!");
      return;
    }
    const s = voice.step + 1;
    setVoice({ on: true, step: s, done: false });
    say(`Paso ${s + 1}. ${recipe.steps[s]}`);
  };

  return (
    <div className={`mc-sheet-wrap ${wide ? "wide" : ""}`} onMouseDown={(e) => e.target === e.currentTarget && onClose()}>
      <div className="mc-sheet" role="dialog" aria-modal="true" aria-label={recipe.title}>
        <div className="flex-none flex items-center justify-between px-5 pt-4 pb-2">
          <button type="button" className="mc-iconbtn" aria-label="Cerrar receta" onClick={onClose}><X size={20} /></button>
          <button
            type="button" className="mc-iconbtn" aria-pressed={fav}
            aria-label={fav ? "Quitar de favoritos" : "Guardar en favoritos"} onClick={() => onFav(recipe)}
          >
            <Heart size={20} fill={fav ? "currentColor" : "none"} />
          </button>
        </div>

        <div className="flex-1 min-h-0 overflow-y-auto px-5 pb-4">
          <div className="flex items-center gap-3">
            <div className="mc-recipe-emoji" style={{ width: 64, height: 64, fontSize: 36 }} aria-hidden="true">{recipe.emoji}</div>
            <div className="min-w-0">
              <h2 className="mc-display text-2xl font-extrabold" style={{ lineHeight: 1.1 }}>{recipe.title}</h2>
              <div className="flex flex-wrap items-center gap-x-3 mt-1 mc-soft text-sm font-semibold">
                <span className="inline-flex items-center gap-1"><Clock size={14} /> {recipe.time} min</span>
                <span className="mc-deep inline-flex items-center gap-1"><Sparkles size={14} /> {recipe.pct}% de coincidencia</span>
              </div>
            </div>
          </div>

          <h3 className="font-extrabold mt-5 mb-2">De tu despensa</h3>
          <div className="flex flex-wrap gap-1.5">
            {recipe.used.map((id) => (
              <span key={id} className="mc-mini" style={{ background: "var(--brand-soft)", color: "var(--brand-ink)" }}>
                <span aria-hidden="true">{EMOJI[id]}</span> {NAME_CAP[id]}
              </span>
            ))}
          </div>
          <p className="mc-soft text-sm mt-2">Básicos de cocina: sal, pimienta, aceite y agua.</p>

          <h3 className="font-extrabold mt-5 mb-2">Preparación en 3 pasos</h3>
          <ol className="flex flex-col gap-2.5" style={{ listStyle: "none", padding: 0, margin: 0 }}>
            {recipe.steps.map((s, i) => (
              <li key={i} className={`mc-step ${voice.on && !voice.done && voice.step === i ? "is-on" : ""}`}>
                <span className="mc-stepnum">{i + 1}</span>
                <p style={{ margin: 0 }}>{s}</p>
              </li>
            ))}
          </ol>
        </div>

        <div className="flex-none px-5 pt-3 pb-5" style={{ borderTop: "1px solid var(--line)", background: "#fff" }}>
          {!voice.on ? (
            <button type="button" className="mc-btn dark w-full" style={{ minHeight: 52 }} onClick={start}>
              <Mic size={19} /> Modo Manos Libres por Voz
            </button>
          ) : (
            <div className="mc-voice">
              <div className="flex items-center gap-3">
                <span className="mc-mic" aria-hidden="true"><Mic size={21} /></span>
                <div className="flex-1 min-w-0">
                  <p className="font-extrabold" style={{ margin: 0 }}>
                    {voice.done ? "¡Buen provecho!" : `Leyendo el paso ${voice.step + 1} de ${recipe.steps.length}`}
                  </p>
                  <p className="mc-soft text-sm" style={{ margin: 0 }}>
                    {voice.done ? "Receta terminada." : "Di «siguiente», «repetir» o «parar»."}
                  </p>
                </div>
                {!voice.done && (
                  <div className="mc-wave" aria-hidden="true"><i /><i /><i /><i /><i /></div>
                )}
                <Volume2 size={18} className="mc-deep" aria-hidden="true" />
              </div>
              <div className="flex flex-wrap gap-2 mt-3">
                {voice.done ? (
                  <button type="button" className="mc-cmd" onClick={start}><RotateCcw size={15} /> Empezar de nuevo</button>
                ) : (
                  <>
                    <button type="button" className="mc-cmd" onClick={next}><SkipForward size={15} /> Siguiente</button>
                    <button type="button" className="mc-cmd" onClick={repeat}><RotateCcw size={15} /> Repetir</button>
                  </>
                )}
                <button type="button" className="mc-cmd" onClick={stop}><Square size={14} /> Parar</button>
              </div>
              <p className="mc-soft" style={{ fontSize: 12, margin: "8px 0 0" }}>Simulación: pulsa los botones como si fueran tus comandos de voz.</p>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

          <span className="mc-logo"><Leaf size={16} strokeWidth={2.5} /></span>
          <span className="mc-display font-extrabold">{"Match & Cocina"}</span>
        </div>
        {!last && <button type="button" className="mc-soft text-sm font-bold" onClick={() => setI(-1)}>Saltar</button>}
      </div>
      <div className="mc-onb-art" key={i}><div className="mc-onb-circle" aria-hidden="true">{s.e}</div></div>
      <div className="text-center">
        <h2 className="mc-display text-3xl font-extrabold">{s.t}</h2>
        <p className="mc-soft mt-2" style={{ maxWidth: 300, margin: "8px auto 0" }}>{s.d}</p>
      </div>
      <div className="mc-dots flex justify-center gap-2 my-5">
        {slides.map((_, k) => <i key={k} className={k === i ? "on" : ""} />)}
      </div>
      <button type="button" className="mc-btn w-full" style={{ minHeight: 54 }} onClick={() => setI(last ? -1 : i + 1)}>
        {last ? "Empezar a cocinar" : "Siguiente"}
      </button>
    </div>
  );
}

function SubScreen({ title, onBack, children }) {
  return (
    <div className="mc-sub" role="dialog" aria-label={title}>
      <div className="mc-subhead">
        <button type="button" className="mc-iconbtn" aria-label="Volver" onClick={onBack}><ChevronLeft size={22} /></button>
        <h2 className="mc-display text-2xl font-extrabold">{title}</h2>
      </div>
      <div className="flex-1 min-h-0 overflow-y-auto px-5 pb-6">{children}</div>
    </div>
  );
}

function HistoryScreen({ history, onBack, onRepeat }) {
  return (
    <SubScreen title="Historial" onBack={onBack}>
      {!history.length ? (
        <p className="mc-soft text-sm mt-6 text-center">Aún no has hecho ningún match.</p>
      ) : (
        <div className="flex flex-col gap-3">
          {history.map((h, k) => (
            <div key={h.id} className="mc-card">
              <div className="flex items-center justify-between">
                <p className="mc-display font-extrabold" style={{ margin: 0 }}>Match {history.length - k}</p>
                <span className="mc-soft text-sm">{h.at}</span>
              </div>
              <p style={{ margin: "8px 0 0", fontSize: 24, letterSpacing: 2 }} aria-label="Ingredientes">{h.ids.map((id) => EMOJI[id]).join(" ")}</p>
              <ul className="mc-soft text-sm" style={{ margin: "8px 0 0", paddingLeft: 18 }}>
                {h.titles.map((t) => <li key={t}>{t}</li>)}
              </ul>
              <button type="button" className="mc-btn ghost w-full mt-3" onClick={() => onRepeat(h.ids)}><RotateCcw size={16} /> Repetir esta despensa</button>
            </div>
          ))}
        </div>
      )}
    </SubScreen>
  );
}

function ShopScreen({ shop, setShop, onBack }) {
  const inList = shop.map((x) => x.id);
  const add = (id) => setShop((p) => [...p, { id, done: false }]);
  const flip = (id) => setShop((p) => p.map((x) => (x.id === id ? { ...x, done: !x.done } : x)));
  const del = (id) => setShop((p) => p.filter((x) => x.id !== id));
  return (
    <SubScreen title="Lista de la compra" onBack={onBack}>
      <p className="mc-soft text-sm" style={{ margin: "0 0 8px" }}>Toca un ingrediente para añadirlo.</p>
      <div className="flex gap-2 overflow-x-auto mc-noscroll pb-2">
        {INGREDIENTS.filter((i) => !inList.includes(i.id)).map((i) => (
          <button key={i.id} type="button" className="mc-chip" onClick={() => add(i.id)}>
            <Plus size={14} /> {i.emoji} {i.name}
          </button>
        ))}
      </div>
      <div className="mc-card mt-3" style={{ padding: "4px 16px" }}>
        {!shop.length && <p className="mc-soft text-sm text-center" style={{ padding: "18px 0" }}>Tu lista está vacía.</p>}
        {shop.map((x, k) => (
          <div key={x.id} className="flex items-center gap-3" style={{ padding: "12px 0", borderTop: k ? "1px solid var(--line)" : 0 }}>
            <button type="button" className="mc-roundcheck" aria-pressed={x.done} aria-label={`Marcar ${NAME[x.id]}`} onClick={() => flip(x.id)}>
              {x.done && <Check size={15} strokeWidth={3.5} />}
            </button>
            <span style={{ fontSize: 24 }} aria-hidden="true">{EMOJI[x.id]}</span>
            <span className="flex-1" style={{ fontWeight: 700, textDecoration: x.done ? "line-through" : "none", opacity: x.done ? 0.5 : 1 }}>{NAME_CAP[x.id]}</span>
            <button type="button" className="mc-soft" aria-label={`Quitar ${NAME[x.id]}`} onClick={() => del(x.id)}><X size={18} /></button>
          </div>
        ))}
      </div>
      {shop.some((x) => x.done) && (
        <button type="button" className="mc-btn ghost w-full mt-3" onClick={() => setShop((p) => p.filter((x) => !x.done))}>Quitar comprados</button>
      )}
    </SubScreen>
  );
}

function ProfileScreen({ stats, favCount, prefs, setPrefs, onTutorial, histCount, shopCount, onOpen }) {
  const saved = (stats.used * 0.9).toFixed(2).replace(".", ",");
  const rows = [
    ["veg", "Vegetariano", "Oculta carnes y pescado"],
    ["lact", "Sin lactosa", "Oculta leche, queso, yogur y mantequilla"],
    ["gluten", "Sin gluten", "Oculta pasta, pan y tortillas"],
  ];
  return (
    <div className="flex-1 min-h-0 overflow-y-auto">
      <div className="px-5 pt-5 pb-6 flex flex-col gap-4">
        <div className="flex items-center gap-3">
          <span className="mc-avatar"><User size={22} /></span>
          <div>
            <h2 className="mc-display text-2xl font-extrabold" style={{ lineHeight: 1.1 }}>Tu cocina</h2>
            <p className="mc-soft text-sm">Tu impacto y tus preferencias</p>
          </div>
        </div>
        <div className="mc-hero">
          <p style={{ margin: 0, fontSize: 13, fontWeight: 700, opacity: 0.8 }}>Ahorro estimado</p>
          <p className="mc-display" style={{ margin: "2px 0 0", fontSize: 40, fontWeight: 800 }}>{saved} €</p>
          <p style={{ margin: "4px 0 0", fontSize: 12.5, opacity: 0.75 }}>Calculado a 0,90 € por ingrediente aprovechado.</p>
        </div>
        <div className="grid grid-cols-3 gap-3">
          {[[stats.matches, "Matches"], [stats.used, "Aprovechados"], [favCount, "Favoritas"]].map(([v, l]) => (
            <div key={l} className="mc-card text-center" style={{ padding: "14px 6px" }}>
              <p className="mc-display" style={{ margin: 0, fontSize: 26, fontWeight: 800 }}>{v}</p>
              <p className="mc-soft" style={{ margin: 0, fontSize: 12, fontWeight: 600 }}>{l}</p>
            </div>
          ))}
        </div>
        <div className="mc-card" style={{ padding: "6px 16px" }}>
          <h3 className="font-extrabold" style={{ margin: "10px 0 2px" }}>Preferencias de dieta</h3>
          {rows.map(([k, t, d], idx) => (
            <div key={k} className="flex items-center gap-3" style={{ padding: "12px 0", borderTop: idx ? "1px solid var(--line)" : 0 }}>
              <div className="flex-1">
                <p style={{ margin: 0, fontWeight: 700 }}>{t}</p>
                <p className="mc-soft" style={{ margin: 0, fontSize: 12.5 }}>{d}</p>
              </div>
              <button type="button" role="switch" aria-checked={prefs[k]} aria-label={t} className="mc-switch" onClick={() => setPrefs((p) => ({ ...p, [k]: !p[k] }))} />
            </div>
          ))}
        </div>
        <div className="mc-card" style={{ padding: 0, overflow: "hidden" }}>
          {[["historial", History, "Historial de matches", histCount], ["compra", ShoppingCart, "Lista de la compra", shopCount]].map(([k, Icon, t, c], idx) => (
            <button key={k} type="button" className="mc-row" style={{ borderTop: idx ? "1px solid var(--line)" : 0 }} onClick={() => onOpen(k)}>
              <span className="mc-rowicon"><Icon size={18} /></span>
              <span className="flex-1" style={{ fontWeight: 700 }}>{t}</span>
              <span className="mc-soft text-sm">{c}</span>
              <ChevronRight size={18} className="mc-soft" />
            </button>
          ))}
        </div>
        <button type="button" className="mc-btn ghost" onClick={onTutorial}>Ver tutorial de bienvenida</button>
      </div>
    </div>
  );
}

/* ───────────────────────── Componente principal ───────────────────────── */

function MatchCocina() {
  const [tab, setTab] = useState("despensa");
  const [cat, setCat] = useState("Todos");
  const [selected, setSelected] = useStored("selected", []);
  const [loading, setLoading] = useState(false);
  const [results, setResults] = useState(null);
  const [favs, setFavs] = useStored("favs", []);
  const [openRecipe, setOpenRecipe] = useState(null);
  const [wide, setWide] = useState(false);
  const [onboard, setOnboardRaw] = useState(() => {
    try { return localStorage.getItem("mc:seen") ? -1 : 0; } catch (e) { return 0; }
  });
  const setOnboard = (v) => {
    setOnboardRaw(v);
    if (v === -1) { try { localStorage.setItem("mc:seen", "1"); } catch (e) { /* ignorar */ } }
  };
  const [screen, setScreen] = useState(null);
  const [history, setHistory] = useStored("history", []);
  const [shop, setShop] = useStored("shop", []);
  const [prefs, setPrefs] = useStored("prefs", { veg: false, lact: false, gluten: false });
  const [stats, setStats] = useStored("stats", { matches: 0, used: 0 });
  const devRef = useRef(null);
  const timer = useRef(null);

  // Master-Detail cuando el dispositivo se estira (formato tablet)
  useEffect(() => {
    const el = devRef.current;
    if (!el || typeof ResizeObserver === "undefined") return;
    const ro = new ResizeObserver(([e]) => setWide(e.contentRect.width >= 720));
    ro.observe(el);
    return () => ro.disconnect();
  }, []);
  useEffect(() => () => clearTimeout(timer.current), []);

  const backRef = useRef(() => {});

  const order = useMemo(() => INGREDIENTS.filter((i) => selected.includes(i.id)).map((i) => i.id), [selected]);
  const sig = order.join(",") + "|" + Object.values(prefs).map(Number).join("");
  const stale = !!results && results.sig !== sig;
  const favIds = favs.map((f) => f.id);

  const toggle = (id) => setSelected((p) => (p.includes(id) ? p.filter((x) => x !== id) : [...p, id]));
  const toggleFav = (r) => setFavs((p) => (p.some((f) => f.id === r.id) ? p.filter((f) => f.id !== r.id) : [r, ...p]));

  const runMatch = () => {
    if (order.length < 2 || loading) return;
    const ids = filterPrefs(order, prefs);
    const mySig = sig;
    setLoading(true);
    setOpenRecipe(null);
    clearTimeout(timer.current);
    timer.current = setTimeout(() => {
      const list = ids.length ? buildMatches(ids) : [];
      setResults({ list, count: ids.length, sig: mySig });
      if (list.length) {
        setHistory((h) => [{ id: Date.now(), ids, at: new Date().toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" }), titles: list.map((r) => r.title) }, ...h].slice(0, 30));
      }
      setStats((st) => ({ matches: st.matches + 1, used: st.used + new Set(list.flatMap((r) => r.used)).size }));
      setTab("match");
      setLoading(false);
    }, 1900);
  };

  const showPantry = wide || tab === "despensa";
  const showRight = wide || tab !== "despensa";

  const rightContent =
    tab === "perfil" ? (
      <ProfileScreen stats={stats} favCount={favs.length} prefs={prefs} setPrefs={setPrefs} onTutorial={() => setOnboard(0)} histCount={history.length} shopCount={shop.length} onOpen={setScreen} />
    ) : tab === "favoritos" ? (
      <FavsPanel favs={favs} onFav={toggleFav} onOpen={setOpenRecipe} />
    ) : (
      <ResultsPanel
        results={results} stale={stale} favIds={favIds} onFav={toggleFav} onOpen={setOpenRecipe}
        onRematch={runMatch} goPantry={() => setTab("despensa")} wide={wide}
      />
    );

  backRef.current = (exit) => {
    if (openRecipe) setOpenRecipe(null);
    else if (screen) setScreen(null);
    else if (onboard >= 0) setOnboard(-1);
    else if (loading) return;
    else if (tab !== "despensa") setTab("despensa");
    else exit();
  };

  return (
    <div className="mc-root mc-stage">

      <div className="mc-wrap">

        <div ref={devRef} className="mc-device">

          <div className="mc-body">
            <div className="flex-1 min-h-0 flex">
              {showPantry && (
                <section
                  className="relative flex flex-col min-h-0"
                  style={wide ? { width: "44%", flex: "none" } : { flex: 1 }}
                  aria-label="Mi despensa"
                >
                  <Pantry
                    selected={selected} toggle={toggle} cat={cat} setCat={setCat}
                    clear={() => setSelected([])} onMatch={runMatch} loading={loading}
                  />
                </section>
              )}
              {showRight && (
                <section
                  className="flex-1 min-h-0 min-w-0 flex flex-col"
                  style={wide ? { borderLeft: "1px solid var(--line)", background: "#F5F8F6" } : undefined}
                  aria-label={tab === "favoritos" ? "Favoritos" : "Recetas encontradas"}
                >
                  {rightContent}
                </section>
              )}
            </div>

            <BottomNav tab={tab} setTab={setTab} favCount={favs.length} hasResults={!!results} />

            {loading && <LoadingOverlay ids={order} />}
            {screen === "historial" && (
              <HistoryScreen history={history} onBack={() => setScreen(null)} onRepeat={(ids) => { setSelected(ids); setScreen(null); setTab("despensa"); }} />
            )}
            {screen === "compra" && <ShopScreen shop={shop} setShop={setShop} onBack={() => setScreen(null)} />}
            {onboard >= 0 && <Onboarding i={onboard} setI={setOnboard} />}
            {openRecipe && (
              <RecipeSheet
                key={openRecipe.id}
                recipe={openRecipe}
                wide={wide}
                fav={favIds.includes(openRecipe.id)}
                onFav={toggleFav}
                onClose={() => setOpenRecipe(null)}
              />
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<MatchCocina />);
})();
</script>
</body>
</html>
